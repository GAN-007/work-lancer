services:
  - type: web
    name: work-lancer-2
    env: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: work-lancer-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: work-lancer-redis
          property: connectionString
databases:
  - name: work-lancer-db
    plan: starter
  - name: work-lancer-redis
    plan: starter
