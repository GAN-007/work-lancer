name: GALIKA production deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require deployment secrets
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PATH_ON_HOST: ${{ secrets.PRODUCTION_PATH }}
        run: |
          test -n "$HOST" || { echo "::error::PRODUCTION_HOST missing"; exit 1; }
          test -n "$USER" || { echo "::error::PRODUCTION_USER missing"; exit 1; }
          test -n "$KEY" || { echo "::error::PRODUCTION_SSH_KEY missing"; exit 1; }
          test -n "$PATH_ON_HOST" || { echo "::error::PRODUCTION_PATH missing"; exit 1; }
      - name: Deploy, migrate, validate, and restart GALIKA workers
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.PRODUCTION_PATH }}"
            git fetch origin
            DEPLOY_REF="${{ inputs.ref || github.ref_name }}"
            git checkout "$DEPLOY_REF"
            git pull --ff-only origin "$DEPLOY_REF"
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan galika:doctor --require-external
            sudo cp deploy/supervisor/galika-worker.conf /etc/supervisor/conf.d/galika-worker.conf
            sudo supervisorctl reread
            sudo supervisorctl update
            sudo supervisorctl restart galika-daemon galika-scheduler
            sleep 5
            sudo supervisorctl status galika-daemon galika-scheduler
            php artisan galika:watchdog
