name: GALIKA CI
on:
  push:
    branches: [main, galika-os]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite
      - name: Validate PHP syntax
        run: find app config database/migrations routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - name: Verify critical GALIKA commands
        run: |
          php artisan list | grep -E 'galika:production-canary|galika:prove-live|galika:reconcile-acks|galika:daemon|galika:doctor|galika:watchdog|galika:scorecard|galika:replay-dead-letter|galika:backup-check'
      - name: Verify runtime configuration parity
        run: |
          grep -q 'galika:daemon' deploy/supervisor/galika-worker.conf
          grep -q 'galika:daemon' docker/supervisord.conf
