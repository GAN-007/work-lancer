name: GALIKA CI
on:
  push:
    branches: [main, galika-os]
  pull_request:
    branches: [main]

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite
      - name: Validate PHP syntax
        run: find app config database/migrations routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
      - name: Verify critical GALIKA commands
        run: |
          php artisan list | grep -E 'galika:production-canary|galika:prove-live|galika:reconcile-acks|galika:daemon|galika:doctor|galika:watchdog|galika:scorecard|galika:replay-dead-letter|galika:backup-check|galika:outbox'
      - name: Verify runtime configuration parity
        run: |
          grep -q 'galika:daemon' deploy/supervisor/galika-worker.conf
          grep -q 'galika:daemon' docker/supervisord.conf

  open-source-execution-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate one-command setup launcher
        run: |
          test -x setup.sh
          bash -n setup.sh
          bash -n scripts/bootstrap-open-source-stack.sh
          ./setup.sh --help >/tmp/worklancer-setup-help.txt
          grep -q "Worklancer one-command setup" /tmp/worklancer-setup-help.txt
      - name: Build Worklancer runtime image
        run: docker build -t worklancer-ci .
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/open-web-agent/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r services/open-web-agent/requirements.txt
      - name: Validate sidecar syntax and imports
        run: |
          python -m py_compile services/open-web-agent/app.py
          python -c "import browser_use, crawl4ai, fastapi, httpx, pydantic_settings; print('open-source execution dependencies import successfully')"
          python -c "import importlib.util; spec=importlib.util.spec_from_file_location('worklancer_open_web_agent','services/open-web-agent/app.py'); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module); print('open-web-agent app imports successfully')"
      - name: Validate Docker Compose topology
        env:
          APP_KEY: base64:dGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0LXRlc3QtdGVzdC10ZXN0
          POSTGRES_PASSWORD: ci-postgres-password
          SEARXNG_SECRET: ci-searxng-secret
        run: docker compose -f docker-compose.open-source.yml config >/tmp/worklancer-compose.yml
