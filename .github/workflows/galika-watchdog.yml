name: GALIKA watchdog failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Validate watchdog secrets
        env:
          HEALTH_URL: ${{ secrets.GALIKA_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.GALIKA_HEALTH_TOKEN }}
        run: |
          test -n "$HEALTH_URL" || { echo "::error::GALIKA_HEALTH_URL is not configured"; exit 1; }
          test -n "$HEALTH_TOKEN" || { echo "::error::GALIKA_HEALTH_TOKEN is not configured"; exit 1; }
      - name: Probe production authoritative runtime
        env:
          HEALTH_URL: ${{ secrets.GALIKA_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.GALIKA_HEALTH_TOKEN }}
        run: |
          curl --fail --retry 3 --retry-all-errors --retry-delay 5 --max-time 20             -H "X-GALIKA-HEALTH-TOKEN: $HEALTH_TOKEN" "$HEALTH_URL"
