name: GALIKA watchdog failover
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production worker health
        env:
          HEALTH_URL: ${{ secrets.GALIKA_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.GALIKA_HEALTH_TOKEN }}
        run: |
          test -n "$HEALTH_URL" && test -n "$HEALTH_TOKEN"
          curl --fail --retry 3 --retry-delay 5 --max-time 20 -H "X-GALIKA-HEALTH-TOKEN: $HEALTH_TOKEN" "$HEALTH_URL"
