name: GALIKA watchdog
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production health endpoint
        env:
          GALIKA_HEALTH_URL: ${{ secrets.GALIKA_HEALTH_URL }}
        run: |
          test -n "$GALIKA_HEALTH_URL"
          curl --fail --retry 3 --retry-delay 5 --max-time 20 -H "X-GALIKA-HEALTH-TOKEN: $GALIKA_HEALTH_TOKEN" "$GALIKA_HEALTH_URL"
